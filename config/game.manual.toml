# The hand-written context switch around 0x80151AC0 to 0x80152008 (functions.md, "Jumps
# out of their function"; task-switch.md, "The mechanism"): its three transfers between a
# task and the scheduler 0x80151BC0 become calls of the runtime's rt_host_switch, so the
# yield, the exit and the scheduler are all recompiled.

[[host_switch]]
addr = 0x80151B48
kind = "yield"
reason = "the yield 0x80151AC0 swaps sp and k1 (three xor at 0x80151AE4), saves s0-s7, fp, ra and FP registers below the stack it switched to, then j 0x80151E90 here (slot sw k1,8(t1): the task's sp into its record), a label inside 0x80151BC0 (the scheduler's restore path), not a function start. A manual start at 0x80151E90 does not recompile: 0x80151BC0 then jumps into it (j 0x80151F9C at 0x80151CF4) and it jumps back (j 0x80151CE4 at 0x80151F94)"

[[host_switch]]
addr = 0x80151B78
kind = "exit"
reason = "the exit 0x80151B50 of a finished task calls 0x80149C58 (which frees the task), swaps sp and k1 (xor at 0x80151B70, 0x80151B74 and the slot 0x80151B7C) and j 0x80151E90 here, the same restore path inside 0x80151BC0 as the yield"

[[host_switch]]
addr = 0x80151E88
kind = "resume"
reason = "the scheduler 0x80151BC0 resumes a task: it loads the task's saved registers, swaps sp and k1 (xor at 0x80151E80, 0x80151E84 and the slot 0x80151E8C) and jr ra here into the task, not a return to its caller. 0x80151E90 (addi sp,sp,0xCC), after the slot, is the restore path the yield and the exit jump to, so it runs when the task switches back"
