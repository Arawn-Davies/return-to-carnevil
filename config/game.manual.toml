# What function discovery cannot find in GAME.EXE by itself. Hand-maintained: every
# entry needs a reason that cites the note showing it.
# `python3 -m carnevil_tools functions GAME.EXE -o config/game.functions.toml` reads this
# file (the output's name with .functions.toml replaced by .manual.toml; or --manual).
#
# [[stub_block]]: start, end (exclusive): words the program fills at run time. They are
#   never decoded; each call or jump target inside becomes a one-slot "stub" function.
# [[manual]]: addr: a function start the analysis does not reach.

[[stub_block]]
start = 0x800C408C
end = 0x800C42CC
reason = "zero in the file; _start copies the loader's 72-slot jump table (physical 0, 576 bytes) here at boot (docs/analysis/boot-handoff.md, the copy from 0xA0000000; docs/analysis/functions.md, the stub block)"

[[manual]]
