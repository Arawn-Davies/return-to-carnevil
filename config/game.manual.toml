# What function discovery cannot find in GAME.EXE by itself. Hand-maintained: every
# entry needs a reason that cites the note showing it.
# `python3 -m carnevil_tools functions GAME.EXE -o config/game.functions.toml` reads this
# file (the output's name with .functions.toml replaced by .manual.toml; or --manual).
#
# [[stub_block]]: start, end (exclusive): words the program fills at run time. They are
#   never decoded; each call or jump target inside becomes a one-slot "stub" function.
# [[manual]]: addr: a function start the analysis does not reach.
# [[jump_table]]: jr_addr, targets (case k is targets[k]): the table of a `jr` the analysis
#   cannot resolve. Checked when read: the jr is a jr on a register other than ra in reached
#   code of a function, every target lies inside that function, there is at least one
#   target and one entry per jr_addr, and the analysis does not resolve that jr by itself
#   (an entry for a jr it resolves is refused). Recorded with table_addr = 0.
# [[interpreted]]: addr: a function start left to the interpreter (the recompiler emits a
#   thunk calling interp_run).
# [[host_switch]]: addr, kind ("yield", "exit" or "resume"): a transfer of the task switch
#   that the runtime takes over (rt_host_switch in runtime/include/recomp.h). Checked when
#   read: the kind is one of the three, one entry per addr, and the instruction is a `j`
#   (yield, exit) or a `jr ra` (resume) in reached code of a function. After a resume the
#   analysis goes on after the delay slot.
#
# Errors, each naming the entry: a top-level table other than these five, an entry without a
# reason, an entry missing one of its keys, an entry with a key its kind does not take.

[[stub_block]]
start = 0x800C408C
end = 0x800C42CC
reason = "zero in the file; _start copies the loader's 72-slot jump table (physical 0, 576 bytes) here at boot (docs/analysis/boot-handoff.md, the copy from 0xA0000000; docs/analysis/functions.md, the stub block)"

