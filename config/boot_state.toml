# Calls from GAME.EXE's reached code to targets outside its text range
# [0x800C4000, 0x8016DC4C). For the stub block, addr is where the copied `j` lands in the
# resident loader, stub is the slot GAME.EXE calls and slot its offset in the table:
# stub = 0x800C408C + slot, and each stub is a function with source "stub" in
# config/game.functions.toml (the [[stub_block]] 0x800C408C to 0x800C42CC, end exclusive).

[[external_call]]
addr = 0xBFC00000
region = "boot_rom"
note = "reset vector, reached by lui at,0xBFC0; jalr at after a failed call: a reboot"
callers = [0x800C49C4, 0x800C4CAC, 0x800C4E24, 0x800C4EEC]

