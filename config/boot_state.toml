# Machine state at GAME.EXE's entry (0x800C4000), the point the native runtime starts from.
# Values are from MAME 0.276 (carnevil, default DIP switches) stopped at the first instruction
# of GAME.EXE, cross-checked against a static reading of boot.u32 and GAME.EXE.
# docs/analysis/boot-handoff.md has the evidence, and says which values are unconfirmed.
# Registers are the low 32 bits (MAME shows them sign-extended to 64).

entry = 0x800C4000
sp = 0x807FFFA8      # the loader's stack; _start sets sp = 0x80800000 in its first instruction
gp = 0x00000000      # GAME.EXE never sets gp
status = 0x30010401  # CU1 CU0 DE IM2 IE: interrupts enabled, BEV clear (vectors in RAM)
config = 0x00000003  # K0 = 3 (cacheable, write-back), written at reset; the other fields are
                     # read-only R5000 hardware fields that MAME does not expose (unconfirmed)
fcr31 = 0x01000400   # FS (flush to zero) and the divide-by-zero enable; _start rewrites it
ra = 0x8000EBE8      # in the loader's load-and-run routine, after its jalr to the EXE

# Every non-zero range of RAM below the image at entry. Ranges of non-zero words were merged
# when fewer than 256 zero bytes separate them, except the boot_rom_copy entries, which are
# whole copies of the ROM's bytes and include their zero runs.

[[ram_preload]]
addr = 0x80000000
size = 0x240
source = "boot_rom_copy"
note = "loader jump table: 72 j/nop slots, ROM 0xBFC00F20; slots 0x000/0x080/0x100/0x180 are the exception vectors; _start copies all 576 bytes to 0x800C408C"

[[ram_preload]]
addr = 0x80000240
size = 0x15A00
source = "boot_rom_copy"
note = "rest of the resident loader (code, then initialised data), ROM 0xBFC01160-0xBFC16B60; 186 bytes (69 words) of its data in 0x80014084-0x80015AD3 differ from the ROM (state the loader changed, e.g. the upper-cased name GAME.EXE)"

